<svg xmlns="http://www.w3.org/2000/svg" width="340" height="100" viewBox="0 0 340 100" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Yobuy Multicolor Gradient Logo</title>
  <defs>
    <!-- 五彩渐变 -->
    <linearGradient id="rainbowGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="20%" stop-color="#DD2476"/>
      <stop offset="40%" stop-color="#00C9FF"/>
      <stop offset="60%" stop-color="#92FE9D"/>
      <stop offset="80%" stop-color="#FCEE21"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>

  <!-- 左侧图形图标 (Y的抽象形状) -->
  <g transform="translate(0,8)">
    <path d="M10,0 L40,0 L40,30 L55,50 L70,30 L70,0 L100,0 L100,100 L70,100 L55,70 L40,100 L10,100 Z"
          fill="url(#rainbowGradient)"/>
  </g>

  <!-- 文字 -->
  <text x="115" y="72"
        font-family="Montserrat, Helvetica, Arial, sans-serif"
        font-size="68"
        font-weight="800"
        fill="url(#rainbowGradient)"
        letter-spacing="-2">
    obuy
  </text>
</svg>
