<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">YOYO MALL Colorful Gradient Logo</title>
  <defs>
    <!-- 图标金色渐变 -->
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="0.5" stop-color="#f8b500"/>
      <stop offset="1" stop-color="#fda085"/>
    </linearGradient>

    <!-- 五彩渐变文字 -->
    <linearGradient id="rainbowGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="25%" stop-color="#92FE9D"/>
      <stop offset="50%" stop-color="#FCEE21"/>
      <stop offset="75%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#C71585"/>
    </linearGradient>

    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 左侧圆形图标 -->
  <g filter="url(#shadow)" transform="translate(10,10)">
    <circle cx="80" cy="80" r="70" fill="url(#goldGradient)"/>
    <text x="80" y="108" text-anchor="middle"
          font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-size="64" font-weight="700" fill="#fff" opacity="0.95">
      YY
    </text>
  </g>

  <!-- 右侧文字（五彩渐变） -->
  <g transform="translate(180,90)">
    <text x="0" y="0"
          font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-size="64" font-weight="700"
          fill="url(#rainbowGradient)">
      YOYO
    </text>
    <text x="0" y="40"
          font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-size="28" font-weight="600"
          fill="url(#goldGradient)" letter-spacing="3">
      MALL
    </text>
  </g>
</svg>
